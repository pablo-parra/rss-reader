<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<nav th:fragment="nav(active)">
    <a th:href="@{/}" th:classappend="${active == 'dashboard'} ? 'active'">Dashboard</a>
    <a th:href="@{/sources}" th:classappend="${active == 'sources'} ? 'active'">Sources</a>
</nav>

<th:block th:fragment="flash">
    <p class="flash ok" th:if="${message}" th:text="${message}"></p>
    <p class="flash warn" th:if="${warning}" th:text="${warning}"></p>
    <p class="flash error" th:if="${error}" th:text="${error}"></p>
</th:block>

<form class="fetch" th:fragment="fetchForm(from, source)" th:action="@{/sources/fetch-now}" method="post"
      data-loading="Fetching new articles... this can take a few seconds">
    <input type="hidden" name="from" th:value="${from}">
    <input type="hidden" name="source" th:if="${source != null}" th:value="${source}">
    <button type="submit">Fetch now</button>
    <small>Refreshes every source now, the same as the daily fetch.</small>
</form>

</body>
</html>
