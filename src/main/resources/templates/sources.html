<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sources - RSS Reader</title>
    <link rel="stylesheet" th:href="@{/style.css}">
    <script th:src="@{/app.js}" defer></script>
</head>
<body>
<main>
    <nav th:replace="~{fragments :: nav('sources')}"></nav>
    <h1>Sources</h1>

    <th:block th:replace="~{fragments :: flash}"></th:block>

    <form th:replace="~{fragments :: fetchForm('sources')}"></form>

    <form class="add" th:action="@{/sources}" method="post">
        <input type="text" name="url" placeholder="Blog or feed URL" required>
        <input type="text" name="name" placeholder="Name (optional)">
        <button type="submit">Add source</button>
    </form>

    <section class="opml">
        <form class="import" th:action="@{/sources/import}" method="post" enctype="multipart/form-data"
              data-loading="Importing subscriptions...">
            <label>Import subscriptions (OPML)
                <input type="file" name="file" accept=".opml,.xml,text/xml,text/x-opml,application/xml" required>
            </label>
            <button type="submit">Import</button>
        </form>
        <p class="export">
            <a th:href="@{/sources/export}" download="subscriptions.opml">Export subscriptions (OPML)</a>
            <small th:if="${exportable > 0}" th:text="${exportable} + (${exportable == 1} ? ' RSS source' : ' RSS sources')">n</small>
            <small th:if="${leftOutOfExport > 0}"
                  th:text="${leftOutOfExport} + (${leftOutOfExport == 1} ? ' source has' : ' sources have') + ' no feed and will be left out'">n</small>
        </p>
    </section>

    <p class="empty" th:if="${#lists.isEmpty(sources)}">No sources yet. Add an author's blog or feed URL above.</p>

    <div class="table-wrap" th:unless="${#lists.isEmpty(sources)}">
        <table>
            <thead>
            <tr><th>Name</th><th>URL</th><th>Type</th><th>Last fetch</th><th></th></tr>
            </thead>
            <tbody>
            <tr th:each="source : ${sources}">
                <td th:text="${source.name}">Name</td>
                <td><a th:href="${source.url}" th:text="${source.url}" target="_blank" rel="noopener">url</a></td>
                <td>
                    <span class="badge" th:classappend="${source.type.name() == 'UNSUPPORTED'} ? 'unsupported'"
                          th:text="${source.type}">RSS</span>
                    <small th:if="${source.type.name() == 'UNSUPPORTED'}">skipped by daily fetch</small>
                </td>
                <td>
                    <span th:if="${source.lastFetchStatus != null}" th:text="${source.lastFetchStatus}">OK</span>
                    <small th:if="${source.lastFetchedAt != null}"
                           th:text="${#temporals.format(source.lastFetchedAt, 'yyyy-MM-dd HH:mm')}">time</small>
                    <span th:if="${source.lastFetchStatus == null}">-</span>
                    <small class="fetch-error" th:if="${source.lastFetchError != null}" th:text="${source.lastFetchError}">reason</small>
                </td>
                <td>
                    <form th:if="${source.type.name() == 'UNSUPPORTED'}" th:action="@{/sources/{id}/recheck(id=${source.id})}" method="post"
                          data-loading="Checking the source...">
                        <button type="submit">Check again</button>
                    </form>
                    <form th:action="@{/sources/{id}/delete(id=${source.id})}" method="post">
                        <button type="submit" class="link-danger">Remove</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
