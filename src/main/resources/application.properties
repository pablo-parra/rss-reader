spring.application.name=rss-reader

# SQLite datasource (single connection avoids "database is locked")
spring.datasource.url=jdbc:sqlite:data/app.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.sql.init.mode=always

spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

server.port=8080
server.servlet.session.tracking-modes=cookie

app.content.min-text-length=600
app.archive.base-url=https://archive.ph
app.fetch.cron=0 0 7 * * *
app.dashboard.read-visible-days=7
# Refuse to fetch loopback / link-local addresses (SSRF guard); set to false to read feeds served from this machine
app.fetch.block-internal-hosts=true
